<body>
  <div id="app"></div>
  <script>
  
  // ReactDOM.render(
  // <h1>Hello world...</h1>,
  // document.querySelector('#app')
  // );

import React from "react";
import ReactDOM from "react-dom";

const array = [
  {
    name: "Tim",
    age: 27
  },
  {
    name: "Bob",
    age: 32
  }
];

const App = () => (
  <>
    {array.map((item, index) => (
      <div key={index}>
        <div>Name: {item.name}</div>
        <div>Age: {item.age}</div>
      </div>
    ))}
  </>
);

ReactDOM.render(<App />, document.getElementById("app"));
  </script>
</body>
